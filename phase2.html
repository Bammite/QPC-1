<!DOCTYPE html>

    <link rel="stylesheet" href="./css/phase2.css">
    <style>
        .contenaire{

        #config-modal {
            display: flex;

        }
        .config-input label {

            margin-bottom: 5px;
            font-weight: bold;
        }
        .config-input input, .config-input select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        #player-image-preview {
            width: 100%;
            height: 200px;
            background-color: #ddd;
            margin-top: 10px;
            background-size: cover;
            background-position: center;
            display: none;
        }
        #start-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
        }
        #player-name-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 3;

</head>

            </div>
            <div class="config-input">
                <label for="timer-duration">Durée du Timer (secondes):</label>

            </div>
            <button id="start-btn">Commencer</button>

    <div class="score">Score atteint: 0</div>
    <!-- <script src="/js/phase2.js" defer></script> -->
    <script>
        // Gestion de la configuration initiale
        document.addEventListener('DOMContentLoaded', function() {
            const playerImageInput = document.getElementById('player-image');
            const playerImagePreview = document.getElementById('player-image-preview');
            const startBtn = document.getElementById('start-btn');
            
            // Prévisualisation de l'image
            playerImageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        playerImagePreview.style.backgroundImage = `url(${event.target.result})`;
                        playerImagePreview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // Démarrer la compétition
            startBtn.addEventListener('click', function() {
                const playerName = document.getElementById('player-name').value.trim();
                const timerDuration = parseInt(document.getElementById('timer-duration').value) || 60;
                const playerImageFile = playerImageInput.files[0];
                
                // Afficher le nom du joueur
                if (playerName) {
                    document.getElementById('player-name-display').textContent = playerName;
                }
                
                // Configurer le timer
                timeRemaining = timerDuration;
                document.querySelector('.timer').textContent = formatTime(timeRemaining);
                
                // Configurer l'arrière-plan
                const backgroundContainer = document.getElementById('background-container');
                if (playerImageFile) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        backgroundContainer.style.backgroundImage = `url(${event.target.result})`;
                        backgroundContainer.style.backgroundSize = 'cover';
                        backgroundContainer.style.backgroundPosition = 'center';
                    };
                    reader.readAsDataURL(playerImageFile);
                } else {
                    backgroundContainer.style.backgroundColor = '#ccc';
                }
                
                // Masquer la fenêtre de configuration
                document.getElementById('config-modal').style.display = 'none';
            });
        });

        // Fonctions existantes pour le timer et les scores
        document.querySelectorAll('.hexagon').forEach((hexagon) => {
            hexagon.addEventListener('click', function() {
                
                // Sélectionner le <rect> dans l'hexagone cliqué
                const rect = this.querySelector('rect');

                // Tu peux maintenant manipuler le <rect>, par exemple, changer sa couleur
                if (rect) {
                    rect.setAttribute('fill', 'yellow'); // Change la couleur du fond à jaune
                }

                const currentScore = parseInt(document.querySelector('.score').textContent.split(': ')[1]);
                const hexagonScore = parseInt(this.querySelector('text').textContent);

                // Mettre à jour le score si le score du polygone est supérieur au score actuel
                if (hexagonScore > currentScore) {
                    document.querySelector('.score').textContent = 'Score atteint: ' + hexagonScore;
                }

                // Retirer la classe 'selected' des autres polygones
                document.querySelectorAll('.hexagon').forEach(hex => {
                    hex.classList.remove('selected');
                });

                // Ajouter la classe 'selected' à l'hexagone cliqué
                this.classList.add('selected');
            });
        });

        let timeRemaining = 60;   // Temps restant en secondes
        let timerInterval;        // Référence à l'intervalle pour le compte à rebours
        let isPaused = true;      // Indicateur si le timer est en pause
        let hasStarted = false;   // Indicateur si le timer a déjà démarré

        // Fonction pour formater le temps en minutes:secondes
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            const secondsFormatted = remainingSeconds < 10 ? '0' + remainingSeconds : remainingSeconds;
            return `${minutes}:${secondsFormatted}`;
        }

        // Fonction pour démarrer ou reprendre le compte à rebours
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    if(timeRemaining===10){
                        document.querySelector('.timer').style.color='red'
                    }
                    document.querySelector('.timer').textContent = formatTime(timeRemaining);
                } else {
                    clearInterval(timerInterval);  // Arrêter le compte à rebours à 0
                }
            }, 1000);
        }

        // Gestion du clic sur le timer pour démarrer/mettre en pause
        document.querySelector('.timer').addEventListener('click', function() {
            if (!hasStarted) {
                // Démarrer le compte à rebours au premier clic
                startTimer();
                isPaused = false;
                hasStarted = true;
            } else if (isPaused) {
                // Reprendre le compte à rebours
                startTimer();
                isPaused = false;
            } else {
                // Mettre en pause le compte à rebours
                clearInterval(timerInterval);
                isPaused = true;
            }
        });

        // Initialiser l'affichage du temps sans démarrer le timer
        document.querySelector('.timer').textContent = formatTime(timeRemaining);


        document.querySelector('.score').addEventListener('click', function() {
            document.querySelector('.score').textContent = 'Score atteint: 0';
        });
    </script>
